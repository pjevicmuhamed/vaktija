<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaktija Srebrenik</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#ffffff;
 --panel:#ffffff;
 --gold:#d4af37;
 --gold-soft:#b8962e;
 --white:#f5f5f5;
 --soft:#cfd8dc;
 --border:rgba(212,175,55,0.4);
 --fg:#222222;          
 --accent:#008f5a;      
}

*{box-sizing:border-box}

html,body{
 min-height:100%;
 margin:0;
 background:#ffffff !important;
 color:var(--fg);
 font-family:Arial,Helvetica,sans-serif;
 overflow-x:hidden;   
}

body{
 display:flex;
 justify-content:center;
 align-items:center;
}

.wrap{
 width:100%;
 min-height:100vh;
 padding:clamp(10px,2vw,25px);
 display:flex;
 flex-direction:column;
 background:#ffffff !important;
 max-width: 1400px;
 margin: 0 auto;
}

.header{
 width:100%;
 margin-bottom:10px;
 position:relative;
}

.header-top{
 display:grid;
 grid-template-columns:auto 1fr auto;
 align-items:center;
 gap:15px;
 width:100%;
 text-transform:uppercase;
 text-shadow: 0 0 10px rgba(212,175,55,0.8);
}

.logo{
 height:clamp(60px, 7vw, 130px);
 object-fit: contain;
}

.title{
 font-size:clamp(22px, 3.5vw, 55px);
 color:var(--gold);
 letter-spacing:2px;
 font-weight:700;
 text-align:center;
 width:100%;
 text-shadow: 0 0 10px rgba(212,175,55,0.6);
}

.ornament{
 position:relative;
 width:70%;
 margin:10px auto 0 auto;
 height:20px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.ornament::before,
.ornament::after{
 content:"";
 flex:1;
 height:2px;
 margin:0 15px;
 border-radius:10px;
 background:linear-gradient(
   90deg,
   transparent,
   var(--gold),
   var(--gold-soft),
   var(--gold),
   transparent
 );
}

.ornament-symbol{
 font-size:30px;
 color:var(--gold);
}

.dates{
 display:flex;
 justify-content:center;
 gap:15px;
 margin-top:5px;
 flex-wrap: wrap;
}

.greg,.hijri{
 font-size:clamp(14px, 1.8vw, 26px);
 font-weight:bold;
 color:#555555;
}

.clock{
 font-size:clamp(40px, 7vw, 110px);
 font-weight:900;
 color:var(--accent);
 text-align:center;
 letter-spacing:3px;
 font-family: 'Orbitron', sans-serif;
 text-shadow: 0 0 20px rgba(0, 143, 90, 0.3);
 margin: 10px 0;
}

/* KALIGRAFIJE */
.kaligrafija{
    position:absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index:10;
    pointer-events:none;
}

.kaligrafija.lijevo{
    left: 10px;
}

.kaligrafija.desno{
    right: 10px;
}

.kaligrafija img{
    width: clamp(70px, 12vw, 180px);
    height:auto;
    filter:none;
}

.main-display {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
 gap:12px;
 margin-top: 10px;
}

.test-controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin:15px 0;
  flex-wrap: wrap;
}

.test-controls button{
  font-family: 'Orbitron', sans-serif;
  font-size:14px;
  padding:8px 16px;
  background:transparent;
  color:var(--accent);
  border:2px solid var(--accent);
  border-radius:8px;
  cursor:pointer;
  letter-spacing:1px;
  transition:all 0.3s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.test-controls button:hover{
  background:var(--accent);
  color:#ffffff;
}

#muteBtn{
  font-size:18px;
  padding:8px 12px;
  border-radius:50%;
}

.card{
 background:#ffffff !important;
 border:2px solid var(--border);
 border-radius:15px;
 padding:clamp(12px, 1.5vw, 20px) clamp(8px, 1vw, 15px);
 text-align:center;
 box-shadow: 0 4px 18px rgba(0,0,0,0.08);
 transition:all 0.4s ease;
}

.card.current{
 border:3px solid var(--gold);
 box-shadow: 0 0 25px rgba(212,175,55,0.4);
}

.name{
 font-size: clamp(12px, 1.4vw, 20px);
 color: var(--gold);
 font-weight: 700;
 letter-spacing: 1px;
 margin-bottom: 5px;
}

.time{
 font-size: clamp(24px, 3.5vw, 55px);
 font-weight:900;
 color:#222222;
 font-family:'Orbitron', sans-serif;
 white-space:nowrap;
 display:inline-block;
 padding:0 4px;
}

.countdown{
 color:var(--accent);
 margin-top:2px;
 font-size:clamp(16px, 2.5vw, 28px);
 font-weight:bold;
}

.footer{
 text-align:center;
 margin-top:10px;
}

.nextBox{
 font-size:clamp(18px, 2.5vw, 32px);
 color:var(--accent);
 font-weight: bold;
}

/* ANIMACIJA KLIZANJA TEKSTA S LIJEVE NA DESNU STRANU */
.hadis-container {
  overflow: hidden;
  width: 100%;
  margin-top: 5px;
  padding: 5px 0;
  border-top: 1px solid var(--border);
  background: transparent;
  display: flex;
  align-items: center;
}

.hadis {
  font-size: clamp(20px, 3vw, 32px); /* Veća i uočljivija slova */
  color: #d4af37;
  font-style: italic;
  white-space: nowrap;
  display: inline-block;
  animation: klizanjeLijevoDesno 20s linear infinite; /* Malo brže kretanje da nema praznog hoda */
}

@keyframes klizanjeLijevoDesno {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(100vw);
  }
}

.ramadan-banner{
  font-size: clamp(18px, 2.5vw, 26px);
  letter-spacing: 2px;
  color: #e6c65c;
  text-align: center;
  margin-top: 5px;
  font-weight: 600;
}

@keyframes flash{
 0%{ box-shadow:0 0 10px var(--accent); }
 50%{ box-shadow:0 0 40px var(--accent); }
 100%{ box-shadow:0 0 10px var(--accent); }
}

.card.started{
 animation:flash 1s infinite;
 border:3px solid var(--accent);
}

#muteBtn.muted{
  border-color:red;
  color:red;
}

@media (max-width: 768px) {
  body { display: block; }
  .wrap { padding: 10px; }
  .header-top {
    grid-template-columns: 1fr;
    text-align: center;
    justify-items: center;
    gap: 8px;
  }
  .logo { height: 50px; }
  .kaligrafija {
    position: static;
    transform: none;
    display: flex;
    justify-content: center;
    margin: 5px 0;
  }
  .main-display { flex-direction: column; }
  .kaligrafija img { width: 60px; }
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .clock { font-size: clamp(32px, 8vw, 50px); }
}

@media (max-width: 480px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>

const HIJRI_OFFSET = -2; 
let lastPlayed = null;
let isMuted = false;

// Učitavanje obavijesti/hadisa iz hadisi.txt fajla
async function ucitajHadise() {
    try {
        let response = await fetch('hadisi.txt');
        let text = await response.text();
        let redovi = text.split('\n').map(r => r.trim()).filter(r => r.length > 0);
        if (redovi.length > 0) {
            HADISI = redovi;
        }
    } catch (e) {
        console.error("Greška pri učitavanju hadisa:", e);
    }
}

function playEzan(vakatName){
  if(vakatName === "Izlazak Sunca") return;
  if(isMuted) return;

  const regular = document.getElementById("ezanRegular");
  const zora = document.getElementById("ezanSabah");

  regular.pause();
  zora.pause();
  regular.currentTime = 0;
  zora.currentTime = 0;

  const audio = vakatName === "Zora" ? zora : regular;
  audio.play().catch(()=>{});
}

function toggleMute(){
  isMuted = !isMuted;
  const btn = document.getElementById("muteBtn");
  btn.classList.toggle("muted");

  if(isMuted){
    btn.innerText = "🔇";
    document.getElementById("ezanRegular").pause();
    document.getElementById("ezanSabah").pause();
  } else {
    btn.innerText = "🔊";
  }
}

function pad(n){return n.toString().padStart(2,"0");}

function formatTime(d){
 return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}

function getDateKey(d){
 return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function timeToDate(base,t){
 let [h,m]=t.split(":");
 let d=new Date(base);
 d.setHours(h,m,0,0);
 return d;
}

function updateDate(){
 const now = new Date();
 let islamicDate = new Date(now);

 const key = getDateKey(now);
 const data = VAKTIJA[key];

 if(data){
  const akshamTime = data[4];
  const [akHour, akMin] = akshamTime.split(":").map(Number);
  if(now.getHours() > akHour || (now.getHours() === akHour && now.getMinutes() >= akMin)){
    islamicDate.setDate(islamicDate.getDate() + 1);
  }
 }

 const mjeseci = [
  "januara","februara","marta","aprila","maja","juna",
  "jula","avgusta","septembra","oktobra","novembra","decembra"
 ];

 const dan = now.getDate();
 const mjesec = mjeseci[now.getMonth()];
 const godina = now.getFullYear();

 document.getElementById("greg").innerText = dan + ". " + mjesec + " " + godina + ". /";

 function gregToHijri(gDate){
   const day = gDate.getDate();
   const month = gDate.getMonth()+1;
   const year = gDate.getFullYear();

   const jd = Math.floor((1461*(year+4800+Math.floor((month-14)/12)))/4)
             + Math.floor((367*(month-2-12*Math.floor((month-14)/12)))/12)
             - Math.floor((3*Math.floor((year+4900+Math.floor((month-14)/12))/100))/4)
             + day - 32075;

   const l = jd - 1948440 + 10632;
   const n = Math.floor((l-1)/10631);
   const l2 = l - 10631*n + 354;
   const j = (Math.floor((10985-l2)/5316))*(Math.floor((50*l2)/17719))
           + (Math.floor(l2/5670))*(Math.floor((43*l2)/15238));
   const l3 = l2 - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50))
            - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;

   const m = Math.floor((24*l3)/709);
   const d = l3 - Math.floor((709*m)/24);
   const y = 30*n + j - 30;

   return { day:d, month:m, year:y };
 }

 const hijriMonths = [
  "Muharrem","Safer","Rebiul-evvel","Rebiul-ahir",
  "Džumadel-ula","Džumadel-uhra","Redžeb",
  "Šaban","Ramazan","Ševval","Zul-kade","Zul-hidždže"
 ];

 const h = gregToHijri(islamicDate);

 if(h.month === 9){
   document.body.classList.add("ramadan");
   document.getElementById("ramadanText").style.display = "block";
 }else{
   document.body.classList.remove("ramadan");
   document.getElementById("ramadanText").style.display = "none";
 }

 h.day += HIJRI_OFFSET;
 if(h.day < 1){
   h.month -= 1;
   if(h.month < 1){ h.month = 12; h.year -= 1; }
   h.day = 30;
 }
 document.getElementById("hijri").innerText = h.day + ". " + hijriMonths[h.month-1] + " " + h.year + ".";
}

document.addEventListener("click", function enableAudio(){
  const a1 = document.getElementById("ezanRegular");
  const a2 = document.getElementById("ezanSabah");
  [a1, a2].forEach(a=>{
    if(!a) return;
    a.play().then(()=>{
      a.pause();
      a.currentTime = 0;
    }).catch(()=>{});
  });
  document.removeEventListener("click", enableAudio);
});

function buildGrid(){
 const g=document.getElementById("grid");
 g.innerHTML="";
 for(let i=0;i<6;i++){
  let c=document.createElement("div");
  c.className="card";
  c.innerHTML=`
   <div class="name"></div>
   <div class="time"></div>
  `;
  g.appendChild(c);
 }
}

function update(){
 const now=new Date();
 document.getElementById("clock").innerText=formatTime(now);
 updateDate();

 const key=getDateKey(now);
 const data=VAKTIJA[key];
 if(!data) return;

 let cards=document.querySelectorAll(".card");
 let times=[];

 data.forEach((t,i)=>{
  if(cards[i]) {
    cards[i].querySelector(".name").innerText=NAMES[i];
    cards[i].querySelector(".time").innerText=t;
    cards[i].classList.remove("current");
  }
  times.push({
   name:NAMES[i],
   time:t,
   date:timeToDate(now,t)
  });
 });

 let next=null;
 let current=null;

 for(let i=0;i<times.length;i++){
  if(now<times[i].date){
    next=times[i];
    current=times[i-1]||null;
    break;
  }
 }

 if(!next){
  next=times[0];
  next.date.setDate(next.date.getDate()+1);
  current=times[5];
 }

 if(current){
  let idx=NAMES.indexOf(current.name);
  if(cards[idx]) cards[idx].classList.add("current");
 }

 let diff = Math.floor((next.date-now)/1000);

 if(diff <= 0 && lastPlayed !== next.name){
   playEzan(next.name);
   lastPlayed = next.name;
   let idxNext = NAMES.indexOf(next.name);
   if(cards[idxNext]) cards[idxNext].classList.add("started");
 }

 if(diff > 300){
   lastPlayed = null;
   document.querySelectorAll(".card").forEach(c=>{
     c.classList.remove("started");
   });
 }

 diff = Math.max(0, diff);
 let h=Math.floor(diff/3600);
 let m=Math.floor((diff%3600)/60);
 let s=diff%60;
 let cd=pad(h)+":"+pad(m)+":"+pad(s);

 let idxNext=NAMES.indexOf(next.name);

 cards.forEach(card=>{
  let el = card.querySelector(".countdown");
  if(card === cards[idxNext]){
    if(!el){
      el = document.createElement("div");
      el.className = "countdown";
      card.appendChild(el);
    }
    el.innerText = "Za " + cd;
  } else {
    if(el){ el.remove(); }
  }
 });

 document.getElementById("nextBox").innerText = "SLJEDEĆA AKTIVNOST: "+next.name+" "+next.time;
}
